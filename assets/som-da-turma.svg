<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Som da Turma</title><desc id="d">Representação dos quatro estados visuais da ferramenta: foco total, conversa, muito alto e ouvir.</desc><rect width="640" height="360" fill="#eef2f7"/><rect x="60" y="33" width="520" height="283" rx="22" fill="#fff" stroke="#dbe4ee" stroke-width="2"/><text x="90" y="78" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Som da Turma</text><text x="90" y="104" font-family="Arial,sans-serif" font-size="14" fill="#64748b">Perceber o som. Combinar. Ajustar.</text><g font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#fff"><rect x="89" y="128" width="222" height="58" rx="12" fill="#15803d"/><text x="200" y="164">FOCO TOTAL</text><rect x="326" y="128" width="222" height="58" rx="12" fill="#ca8a04"/><text x="437" y="164" fill="#18201f">CONVERSA</text><rect x="89" y="198" width="222" height="58" rx="12" fill="#b91c1c"/><text x="200" y="234">MUITO ALTO</text><rect x="326" y="198" width="222" height="58" rx="12" fill="#2563eb"/><text x="437" y="234">OUVIR</text></g><text x="320" y="290" font-family="Arial,sans-serif" text-anchor="middle" font-size="12" fill="#64748b">Nível relativo de som · não mede decibéis</text></svg>
