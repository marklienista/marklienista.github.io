name: AL009 live API verification
on:
  push:
    branches: [al009-api-verificacao]
    paths: ['.github/workflows/al009-api-probe.yml']
permissions:
  contents: read
concurrency:
  group: al009-api-probe
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare encrypted disposable fixtures
        run: python3 apertaletra-tests/api_probe.py prepare
      - name: Publish encrypted enrollment fixture only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: al009-encrypted-fixture
          path: al009-api-results/fixture-*.enc
          retention-days: 1
      - name: Exercise real Auth and classroom APIs
        run: python3 -u apertaletra-tests/api_probe.py test
      - name: Publish redacted API results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: al009-api-results
          path: al009-api-results/api-result.json
          retention-days: 7
      - name: Remove local temporary secrets
        if: always()
        run: rm -rf "$RUNNER_TEMP/al009-api-probe"
