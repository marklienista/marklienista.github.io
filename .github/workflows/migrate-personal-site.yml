name: Migracao pontual da pagina profissional
on:
  push:
    branches: [main]
    paths: ['.github/workflows/migrate-personal-site.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: migracao-pagina-profissional
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Copiar somente a pagina aprovada e seus arquivos
        shell: bash
        run: |
          set -euo pipefail
          test ! -e index.html
          staging="$(mktemp -d)"
          curl --fail --silent --show-error --location --retry 2 'https://api.github.com/repos/marklienista/led/tarball/17cc328de98a7cfe40ac93b1d38ee2870d8877c1' -o "$staging/source.tar.gz"
          mkdir "$staging/source"
          tar -xzf "$staging/source.tar.gz" --strip-components=1 -C "$staging/source"
          export SOURCE_SITE="$staging/source/profissional"
          python3 - <<'PY'
          import os, pathlib, hashlib, shutil
          src = pathlib.Path(os.environ['SOURCE_SITE'])
          expected = {
              'index.html': 'b88d0171a3e5a054a970058be039f3b8e304efb9',
              'style.css': 'abba022d9a11d8c4b851994caba5cb39af480903',
              'meempresta/index.html': '2c2cae56472eb6ef69099d327bfdcd8bcda0209a',
              'assets/marcelo.webp': '3c27fcd489fe800afecc885a6c38d1995d755e37',
              'assets/apertaquem.webp': 'b7e0b7e4b44f8a744a8d0952d276a83d5f3795c4',
              'assets/me-empresta.svg': '48d569968403c8468115233e4ad3a068c4754f0a',
              'assets/som-da-turma.svg': '41ca943ca0d74dccbfb7d075674e52e97ea5350c',
          }
          for name, expected_sha in expected.items():
              data = (src / name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if actual != expected_sha:
                  raise RuntimeError('A origem mudou: ' + name)
              destination = pathlib.Path(name)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
          homepage = pathlib.Path('index.html')
          text = homepage.read_text(encoding='utf-8')
          old = 'href="../somdaturma/"'
          if text.count(old) != 1:
              raise RuntimeError('Link do Som da Turma diferente do esperado')
          text = text.replace(old, 'href="/led/somdaturma/"')
          homepage.write_text(text, encoding='utf-8')
          pathlib.Path('.nojekyll').touch()
          print('Sete arquivos migrados; imagem, estilo e textos preservados. Link do Som da Turma ajustado.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html style.css meempresta assets .nojekyll
          git commit -m 'Migra site aprovado para marklienista.github.io sem alterar o visual'
          git push origin HEAD:main
